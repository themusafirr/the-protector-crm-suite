<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Georgia', serif;
    background: #0f172a;
    color: #fef3c7;
    padding: 60px 40px;
    width: 1080px;
    height: 1080px;
  }
  .frame {
    border: 2px solid #f59e0b;
    padding: 60px;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .head { display: flex; justify-content: space-between; align-items: center; }
  .brand { font-size: 16px; letter-spacing: 4px; color: #f59e0b; }
  .title {
    font-size: 96px;
    color: #f59e0b;
    line-height: 1;
    letter-spacing: -3px;
    margin-top: 20px;
  }
  .sub { color: #94a3b8; font-size: 22px; letter-spacing: 6px; margin-top: 8px; }
  .big-quote {
    margin-top: 30px;
    text-align: center;
    font-size: 96px;
    color: #f59e0b;
    font-weight: bold;
  }
  .big-quote-sub {
    text-align: center;
    color: #94a3b8;
    font-size: 22px;
    margin-top: 8px;
  }
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-top: 40px;
  }
  .stat {
    background: rgba(254, 243, 199, 0.05);
    border: 1px solid rgba(245, 158, 11, 0.3);
    padding: 24px;
    border-radius: 12px;
    text-align: center;
  }
  .stat-num { font-size: 36px; color: #f59e0b; font-weight: bold; }
  .stat-label { font-size: 14px; color: #94a3b8; margin-top: 8px; }
  .cta {
    margin-top: 30px;
    background: #f59e0b;
    color: #0f172a;
    padding: 24px;
    text-align: center;
    font-size: 26px;
    font-weight: bold;
    border-radius: 8px;
  }
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 18px;
    color: #94a3b8;
    margin-top: 20px;
  }
  .handle { color: #f59e0b; border-bottom: 1px solid #f59e0b; padding-bottom: 2px; }
</style>
</head>
<body>
<div class="frame">
  <div>
    <div class="head">
      <span class="brand">THE PROTECTOR</span>
      <span style="font-size:32px">👨‍👩‍👧</span>
    </div>
    <h1 class="title">Term<br>Plan</h1>
    <div class="sub">LIFE INSURANCE</div>
  </div>

  <div>
    <div class="big-quote">₹1 Cr</div>
    <div class="big-quote-sub">cover sirf ₹500/month mein</div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-num">2x</div>
      <div class="stat-label">cheaper than LIC</div>
    </div>
    <div class="stat">
      <div class="stat-num">100%</div>
      <div class="stat-label">claim payout</div>
    </div>
    <div class="stat">
      <div class="stat-num">₹6.5L</div>
      <div class="stat-label">tax save u/s 80C</div>
    </div>
    <div class="stat">
      <div class="stat-num">45 days</div>
      <div class="stat-label">claim settlement</div>
    </div>
  </div>

  <div>
    <div class="cta">DM "LIFE" — FREE QUOTE</div>
    <div class="footer">
      <span>Pankaj Kalosiya</span>
      <span><span class="handle">@the.musafirrr__</span></span>
    </div>
  </div>
</div>
</body>
</html>
