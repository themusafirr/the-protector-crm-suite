<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Georgia', serif;
    background: #0f172a;
    color: #fef3c7;
    padding: 60px 40px;
    width: 1080px;
    height: 1080px;
  }
  .frame {
    border: 2px solid #f59e0b;
    padding: 60px;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .head { display: flex; justify-content: space-between; align-items: center; }
  .brand { font-size: 16px; letter-spacing: 4px; color: #f59e0b; }
  .title {
    font-size: 80px;
    color: #f59e0b;
    line-height: 1;
    letter-spacing: -3px;
    margin-top: 20px;
  }
  .sub { color: #94a3b8; font-size: 22px; letter-spacing: 6px; margin-top: 8px; }
  .refer-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-top: 30px;
  }
  .refer-card {
    background: rgba(254, 243, 199, 0.05);
    border: 1px solid #f59e0b;
    border-radius: 16px;
    padding: 30px;
    text-align: center;
  }
  .refer-card .arrow { font-size: 48px; color: #f59e0b; }
  .refer-card .label { font-size: 18px; color: #94a3b8; margin-top: 12px; }
  .cashback {
    margin-top: 30px;
    text-align: center;
    background: #f59e0b;
    color: #0f172a;
    padding: 30px;
    border-radius: 16px;
    font-size: 36px;
    font-weight: bold;
  }
  .cashback-sub {
    text-align: center;
    color: #fef3c7;
    font-size: 20px;
    margin-top: 16px;
    line-height: 1.6;
  }
  .cta {
    margin-top: 30px;
    border: 2px solid #f59e0b;
    color: #f59e0b;
    padding: 24px;
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    border-radius: 8px;
  }
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 18px;
    color: #94a3b8;
    margin-top: 20px;
  }
  .handle { color: #f59e0b; border-bottom: 1px solid #f59e0b; padding-bottom: 2px; }
</style>
</head>
<body>
<div class="frame">
  <div>
    <div class="head">
      <span class="brand">THE PROTECTOR</span>
      <span style="font-size:32px">🎁</span>
    </div>
    <h1 class="title">Refer &<br>Earn</h1>
    <div class="sub">EARN WHILE YOU SHARE</div>
  </div>

  <div class="refer-grid">
    <div class="refer-card">
      <div class="arrow">👥</div>
      <div class="label">DOST KO BHEJO</div>
    </div>
    <div class="refer-card">
      <div class="arrow">🛡️</div>
      <div class="label">INSURANCE KARAWAO</div>
    </div>
  </div>

  <div>
    <div class="cashback">₹200 × 2 = ₹400</div>
    <div class="cashback-sub">
      Tu ₹200 kamao. Dost bhi ₹200 kamae.<br>
      Bina kuch kiye — bas share kar do.
    </div>
  </div>

  <div>
    <div class="cta">📤 DM "REFER" — JOIN PROGRAM</div>
    <div class="footer">
      <span>Pankaj Kalosiya</span>
      <span><span class="handle">@the.musafirrr__</span></span>
    </div>
  </div>
</div>
</body>
</html>
